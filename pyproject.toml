[project]
name = "anac-appalti"
version = "0.1.0"
description = "Pipeline di analytics engineering sui dati aperti ANAC degli appalti pubblici: dbt-core su DuckDB, orchestrata con Dagster."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Harithas Harikaran" }]
dependencies = [
  "dbt-core>=1.12,<1.13",
  "dbt-duckdb>=1.11,<1.12",
  "duckdb>=1.4,<2",
  "dagster>=1.13,<1.14",
  "dagster-dbt>=0.29,<0.30",
  "httpx>=0.28,<1",
  "pyyaml>=6.0.2,<7",
  "typer>=0.15,<1",
]

[project.scripts]
appalti = "anac_appalti.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "dagster-webserver>=1.13,<1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anac_appalti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integrazione: esegue DuckDB, dbt e Dagster sulla fixture (lento)"]
# Solo il rumore di una dipendenza di terze parti: il pacchetto sqlglotrs (extra `rs` di sqlglot, richiesto da
# dagster-dbt[rs]) dichiara di essere deprecato a ogni importazione. Nessun altro avviso è filtrato.
filterwarnings = ["ignore:sqlglotrs is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "build", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
