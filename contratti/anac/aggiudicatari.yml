tabella: aggiudicatari
pacchetto: aggiudicatari
freschezza: true
descrizione: "Operatori aggiudicatari per aggiudicazione. Contiene anche persone fisiche (ditte individuali, professionisti): l'identità è annullata in staging."
colonne:
  - {nome: cig, sorgente: "cig", tipo: varchar, tenere: true, dato_personale: false, descrizione: "CIG del lotto."}
  - {nome: ruolo, sorgente: "ruolo", tipo: varchar, tenere: true, dato_personale: false, descrizione: "Ruolo dell'operatore (monosoggettivo, mandataria, mandante...)."}
  - {nome: codice_fiscale, sorgente: "codice_fiscale", tipo: varchar, tenere: true, dato_personale: true, descrizione: "Codice fiscale o partita IVA dell'operatore."}
  - {nome: denominazione, sorgente: "denominazione", tipo: varchar, tenere: true, dato_personale: true, descrizione: "Denominazione dell'operatore."}
  - {nome: tipo_soggetto, sorgente: "tipo_soggetto", tipo: varchar, tenere: true, dato_personale: false, descrizione: "Tipo di soggetto dichiarato in ANAC."}
  - {nome: id_aggiudicazione, sorgente: "id_aggiudicazione", tipo: bigint, tenere: true, dato_personale: false, descrizione: "Identificativo dell'aggiudicazione (-1 = sconosciuto, annullato in staging)."}
