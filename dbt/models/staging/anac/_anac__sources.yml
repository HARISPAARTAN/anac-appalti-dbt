# Generato da `appalti contratti sync` a partire da contratti/anac/*.yml. Non modificare a mano.
version: 2
sources:
- name: anac
  description: Dati aperti ANAC (dati.anticorruzione.it), licenza CC BY-SA 4.0, atterrati in Parquet dalla pipeline Python.
  tables:
  - name: aggiudicatari
    description: 'Operatori aggiudicatari per aggiudicazione. Contiene anche persone fisiche (ditte individuali, professionisti): l''identità è annullata in staging.'
    meta:
      external_location: read_parquet('{{ env_var('APPALTI_LANDING', 'data/landing') }}/aggiudicatari/*.parquet', union_by_name = true)
      dagster:
        asset_key:
        - landing_aggiudicatari
    loaded_at_field: cast(_data_snapshot as timestamp)
    freshness:
      warn_after:
        count: 40
        period: day
      error_after:
        count: 75
        period: day
    columns:
    - name: cig
      description: CIG del lotto.
    - name: ruolo
      description: Ruolo dell'operatore (monosoggettivo, mandataria, mandante...).
    - name: codice_fiscale
      description: 'Codice fiscale o partita IVA dell''operatore. Può contenere dati di persone fisiche: in staging è annullato quando il codice fiscale non è di 11 cifre.'
    - name: denominazione
      description: 'Denominazione dell''operatore. Può contenere dati di persone fisiche: in staging è annullato quando il codice fiscale non è di 11 cifre.'
    - name: tipo_soggetto
      description: Tipo di soggetto dichiarato in ANAC.
    - name: id_aggiudicazione
      description: Identificativo dell'aggiudicazione (-1 = sconosciuto, annullato in staging).
    - name: _classe_cf
      description: 'Classe del codice fiscale di `codice_fiscale` prima dell''annullamento: persona_giuridica (11 cifre), persona_fisica (16 caratteri), non_verificabile o assente. Non identifica nessuno: il valore originale non è nel landing.'
    - name: _risorsa
      description: Nome del file ANAC senza estensione da cui proviene la riga.
    - name: _data_snapshot
      description: 'Data del file: dal prefisso AAAAMMGG dei delta, altrimenti dalla data di modifica della risorsa CKAN.'
    - name: _caricato_il
      description: Istante di atterraggio del file in Parquet.
    - name: _sha256
      description: SHA-256 dello zip originale nell'archivio raw.
    - name: _hash_riga
      description: 'MD5 del contenuto (già ripulito) della riga, per riconoscere i duplicati esatti nello stesso file. Se un identificativo personale è stato annullato, nell''impronta entra anche `_ordinale_riga`: quelle righe non sono mai duplicati esatti e persone diverse restano righe diverse.'
    - name: _ordinale_riga
      description: Posizione della riga nel file di origine (parte da 1). Vale solo dentro lo stesso file.
  - name: aggiudicazioni
    description: 'Aggiudicazioni dei contratti ordinari: file completo annuale più delta mensili.'
    meta:
      external_location: read_parquet('{{ env_var('APPALTI_LANDING', 'data/landing') }}/aggiudicazioni/*.parquet', union_by_name = true)
      dagster:
        asset_key:
        - landing_aggiudicazioni
    loaded_at_field: cast(_data_snapshot as timestamp)
    freshness:
      warn_after:
        count: 40
        period: day
      error_after:
        count: 75
        period: day
    columns:
    - name: cig
      description: CIG del lotto aggiudicato.
    - name: data_aggiudicazione_definitiva
      description: Data dell'aggiudicazione definitiva.
      data_tests:
      - perdita_parsing:
          arguments:
            tipo: data
          config:
            severity: warn
    - name: esito
      description: Esito della procedura.
    - name: criterio_aggiudicazione
      description: Criterio di aggiudicazione.
    - name: data_comunicazione_esito
      description: Data di comunicazione dell'esito.
    - name: numero_offerte_ammesse
      description: Numero di offerte ammesse.
      data_tests:
      - perdita_parsing:
          arguments:
            tipo: intero
          config:
            severity: warn
    - name: numero_offerte_escluse
      description: Numero di offerte escluse.
    - name: importo_aggiudicazione
      description: Importo di aggiudicazione in euro.
    - name: ribasso_aggiudicazione
      description: Ribasso di aggiudicazione in percentuale.
    - name: num_imprese_offerenti
      description: Numero di imprese offerenti.
      data_tests:
      - perdita_parsing:
          arguments:
            tipo: intero
          config:
            severity: warn
    - name: flag_subappalto
      description: Vero se è previsto il subappalto.
    - name: id_aggiudicazione
      description: Identificativo ANAC dell'aggiudicazione.
    - name: cod_esito
      description: Codice dell'esito (1 = aggiudicata).
    - name: _risorsa
      description: Nome del file ANAC senza estensione da cui proviene la riga.
    - name: _data_snapshot
      description: 'Data del file: dal prefisso AAAAMMGG dei delta, altrimenti dalla data di modifica della risorsa CKAN.'
    - name: _caricato_il
      description: Istante di atterraggio del file in Parquet.
    - name: _sha256
      description: SHA-256 dello zip originale nell'archivio raw.
    - name: _hash_riga
      description: 'MD5 del contenuto (già ripulito) della riga, per riconoscere i duplicati esatti nello stesso file. Se un identificativo personale è stato annullato, nell''impronta entra anche `_ordinale_riga`: quelle righe non sono mai duplicati esatti e persone diverse restano righe diverse.'
    - name: _ordinale_riga
      description: Posizione della riga nel file di origine (parte da 1). Vale solo dentro lo stesso file.
  - name: cig
    description: 'Lotti (CIG) pubblicati: file annuali cig-AAAA (uno per mese di pubblicazione) e delta mensili del pacchetto cig. Più righe per CIG, una per CPV (flag_prevalente).'
    meta:
      external_location: read_parquet('{{ env_var('APPALTI_LANDING', 'data/landing') }}/cig/*.parquet', union_by_name = true)
      dagster:
        asset_key:
        - landing_cig
    loaded_at_field: cast(_data_snapshot as timestamp)
    freshness:
      warn_after:
        count: 40
        period: day
      error_after:
        count: 75
        period: day
    columns:
    - name: cig
      description: Codice Identificativo Gara del lotto (10 caratteri).
    - name: cig_accordo_quadro
      description: CIG dell'accordo quadro o convenzione da cui deriva il lotto.
    - name: numero_gara
      description: Numero della gara che raggruppa i lotti.
    - name: oggetto_gara
      description: 'Oggetto della gara. Testo libero: i codici fiscali di persona fisica trovati nel testo sono sostituiti da [CF] al landing; i nomi di persona nel testo non sono riconosciuti.'
    - name: importo_complessivo_gara
      description: Importo complessivo della gara in euro.
    - name: n_lotti_componenti
      description: Numero di lotti della gara.
    - name: oggetto_lotto
      description: 'Oggetto del lotto. Testo libero: i codici fiscali di persona fisica trovati nel testo sono sostituiti da [CF] al landing; i nomi di persona nel testo non sono riconosciuti.'
    - name: importo_lotto
      description: Importo del lotto in euro.
    - name: oggetto_principale_contratto
      description: 'Oggetto principale: LAVORI, SERVIZI o FORNITURE.'
    - name: stato
      description: Stato del CIG (ATTIVO o cancellato).
    - name: settore
      description: SETTORI ORDINARI o SETTORI SPECIALI.
    - name: luogo_istat
      description: Codice ISTAT del comune del luogo di esecuzione (6 cifre) o codice NUTS.
    - name: provincia
      description: Provincia del luogo di esecuzione.
    - name: data_pubblicazione
      description: Data di pubblicazione del lotto.
      data_tests:
      - perdita_parsing:
          arguments:
            tipo: data
          config:
            severity: warn
    - name: data_scadenza_offerta
      description: Termine per la presentazione delle offerte.
      data_tests:
      - perdita_parsing:
          arguments:
            tipo: data
          config:
            severity: warn
    - name: cod_tipo_scelta_contraente
      description: Codice della procedura di scelta del contraente.
    - name: tipo_scelta_contraente
      description: Procedura di scelta del contraente.
    - name: cod_modalita_realizzazione
      description: Codice della modalità di realizzazione.
    - name: modalita_realizzazione
      description: Modalità di realizzazione (contratto d'appalto, accordo quadro, discendente da accordo quadro...).
    - name: codice_ausa
      description: Codice AUSA della stazione appaltante.
    - name: cf_amministrazione_appaltante
      description: Codice fiscale dell'amministrazione appaltante (se è di 16 caratteri, cioè una persona fisica, in staging è annullato).
    - name: denominazione_amministrazione_appaltante
      description: Denominazione dell'amministrazione appaltante.
    - name: sezione_regionale
      description: Sezione regionale dell'Osservatorio ANAC.
    - name: cod_cpv
      description: Codice CPV del vocabolario comune per gli appalti.
    - name: descrizione_cpv
      description: Descrizione del codice CPV.
    - name: flag_prevalente
      description: Vero se il CPV della riga è quello prevalente del lotto.
    - name: cod_motivo_cancellazione
      description: Codice del motivo di cancellazione.
    - name: motivo_cancellazione
      description: 'Motivo di cancellazione del CIG. Testo libero: i codici fiscali di persona fisica trovati nel testo sono sostituiti da [CF] al landing; i nomi di persona nel testo non sono riconosciuti.'
    - name: data_cancellazione
      description: Data di cancellazione del CIG.
    - name: data_ultimo_perfezionamento
      description: Data dell'ultimo perfezionamento del CIG.
    - name: durata_prevista
      description: Durata prevista del contratto in giorni.
    - name: flag_urgenza
      description: Vero se la procedura è stata dichiarata urgente.
    - name: importo_sicurezza
      description: Oneri per la sicurezza in euro.
    - name: cod_esito
      description: Codice dell'esito (1 = aggiudicata).
    - name: esito
      description: Esito della procedura.
    - name: data_comunicazione_esito
      description: Data di comunicazione dell'esito.
    - name: flag_pnrr_pnc
      description: Vero se il lotto è finanziato con PNRR o PNC.
    - name: _risorsa
      description: Nome del file ANAC senza estensione da cui proviene la riga.
    - name: _data_snapshot
      description: 'Data del file: dal prefisso AAAAMMGG dei delta, altrimenti dalla data di modifica della risorsa CKAN.'
    - name: _caricato_il
      description: Istante di atterraggio del file in Parquet.
    - name: _sha256
      description: SHA-256 dello zip originale nell'archivio raw.
    - name: _hash_riga
      description: 'MD5 del contenuto (già ripulito) della riga, per riconoscere i duplicati esatti nello stesso file. Se un identificativo personale è stato annullato, nell''impronta entra anche `_ordinale_riga`: quelle righe non sono mai duplicati esatti e persone diverse restano righe diverse.'
    - name: _ordinale_riga
      description: Posizione della riga nel file di origine (parte da 1). Vale solo dentro lo stesso file.
  - name: partecipanti
    description: 'Operatori partecipanti alle procedure (esclude le gare aperte o chiuse da meno di 30 giorni). Contiene anche persone fisiche: l''identità è annullata in staging.'
