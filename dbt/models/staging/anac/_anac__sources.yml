    - name: _hash_riga
      description: 'MD5 del contenuto (già ripulito) della riga, per riconoscere i duplicati esatti nello stesso file. Se un identificativo personale è stato annullato, nell''impronta entra anche `_ordinale_riga`: quelle righe non sono mai duplicati esatti e persone diverse restano righe diverse.'
    - name: _ordinale_riga
      description: Posizione della riga nel file di origine (parte da 1). Vale solo dentro lo stesso file.
  - name: stazioni_appaltanti
    description: Anagrafe delle stazioni appaltanti (enti pubblici e società, ma anche ditte individuali e professionisti), aggiornamento annuale. Il landing la conserva come ANAC la pubblica; le stazioni che sono persone fisiche (codice fiscale di 16 caratteri o forma giuridica individuale) perdono codice fiscale, partita IVA e nome in staging.
    meta:
      external_location: read_parquet('{{ env_var('APPALTI_LANDING', 'data/landing') }}/stazioni_appaltanti/*.parquet', union_by_name = true)
      dagster:
        asset_key:
        - landing_stazioni_appaltanti
    columns:
    - name: codice_fiscale
      description: Codice fiscale dell'ente.
    - name: partita_iva
      description: Partita IVA dell'ente.
    - name: denominazione
      description: Denominazione dell'ente.
    - name: codice_ausa
      description: Codice AUSA.
    - name: natura_giuridica_codice
      description: Codice della natura giuridica.
    - name: natura_giuridica_descrizione
      description: Natura giuridica.
    - name: soggetto_estero
      description: Vero per soggetti esteri.
    - name: provincia_codice
      description: Provincia in formato ISO 3166-2 (IT-MI).
    - name: provincia
      description: Nome della provincia.
    - name: codice_comune
      description: Codice ISTAT del comune.
    - name: comune
      description: Comune della sede.
    - name: flag_inhouse
      description: Vero per le società in house.
    - name: flag_partecipata
