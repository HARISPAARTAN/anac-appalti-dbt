name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run appalti contratti sync --verifica
      - run: uv run pytest tests/unit -q

  pipeline:
    needs: lint-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Pipeline sulla fixture, mese 1 e mese 2
        run: |
          uv run appalti run --fixtures --mese 1
          uv run appalti run --fixtures --mese 2
      - name: Report di qualità e copertura dei test
        run: |
          uv run appalti report --fixtures --mese 2
          uv run appalti copertura-test --fixtures
          cat build/fixture/docs/qualita-dati.md >> "$GITHUB_STEP_SUMMARY"
      - run: uv run dagster definitions validate -m anac_appalti.definitions
      - run: uv run pytest tests/integration -q -m integrazione
