  - name: test_partecipanti_righe_correnti
    description: "righe_correnti sui partecipanti: solo il file più recente per CIG (prima _data_snapshot, poi _risorsa), duplicati esatti tolti, due persone fisiche annullate con hash diversi restano due righe, CIG nullo scartato."
    model: int_partecipanti__corrente
    given:
      - input: ref('stg_anac__partecipanti')
        rows:
