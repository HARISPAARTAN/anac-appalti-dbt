version: 2

models:
  - name: int_cig__versioni
    description: "Tutte le versioni dei lotti: una riga per CIG e file (riga del CPV prevalente), con duplicati esatti contati, duplicati in conflitto segnalati, n_versioni e ordine_versione (1 = corrente)."
    config:
      meta:
        chiave: versione_key
    columns:
      - name: versione_key
        description: "Chiave surrogata md5 di cig e _risorsa."
        data_tests:
          - unique
          - not_null
      - name: n_duplicati_esatti
        description: "Righe identiche in più nello stesso file per questo CIG."
      - name: flag_duplicato_conflittuale
        description: "Più righe prevalenti con contenuto diverso nello stesso file; vince l'ordine di _hash_riga."
      - name: ordine_versione
        description: "1 per la versione più recente (_data_snapshot, poi _risorsa)."

  - name: int_cig__corrente
    description: "Una riga per CIG: la versione corrente del lotto, dall'anno anno_minimo in poi. Incrementale (delete+insert su cig)."
    config:
      meta:
        chiave: cig
    columns:
      - name: cig
        description: "Codice Identificativo Gara."
        data_tests:
          - unique
          - not_null

  - name: int_aggiudicazioni__corrente
    description: "Una riga per aggiudicazione: la versione più recente. Incrementale (delete+insert su id_aggiudicazione). Comprende anche aggiudicazioni di lotti fuori ambito."
    config:
      meta:
        chiave: id_aggiudicazione
    columns:
      - name: id_aggiudicazione
        description: "Identificativo ANAC dell'aggiudicazione."
        data_tests:
          - unique
          - not_null

  - name: int_aggiudicatari__corrente
    description: "Aggiudicatari correnti: righe del file più recente per CIG e aggiudicazione, senza duplicati esatti."
    config:
      meta:
        chiave: aggiudicatario_key
    columns:
      - name: aggiudicatario_key
        description: "Chiave surrogata md5 di cig, _risorsa e _hash_riga."
        data_tests:
          - unique
          - not_null

  - name: int_partecipanti__corrente
    description: "Partecipanti correnti: righe del file più recente per CIG, senza duplicati esatti."
    config:
      meta:
        chiave: partecipante_key
    columns:
      - name: partecipante_key
        description: "Chiave surrogata md5 di cig, _risorsa e _hash_riga."
        data_tests:
          - unique
          - not_null

  - name: int_varianti__corrente
    description: "Una riga per variante, versione più recente."
    config:
      meta:
        chiave: id_variante
    columns:
      - name: id_variante
        description: "Identificativo ANAC della variante."
        data_tests:
          - unique
          - not_null

  - name: int_subappalti__corrente
    description: "Una riga per subappalto, versione più recente."
    config:
      meta:
        chiave: id_subappalto
    columns:
      - name: id_subappalto
        description: "Identificativo ANAC del subappalto."
        data_tests:
          - unique
          - not_null

  - name: int_operatori
    description: "Una riga per persona giuridica (codice di 11 cifre) vista come aggiudicatario, partecipante, subappaltatore o subappaltante; le persone fisiche non compaiono."
    config:
      meta:
        chiave: codice_fiscale
    columns:
      - name: codice_fiscale
        description: "Codice fiscale o partita IVA di 11 cifre."
        data_tests:
          - unique
          - not_null
      - name: denominazione
        description: "Denominazione dall'occorrenza più recente."

  - name: int_lotti__qualita
    description: "Una riga per lotto corrente con tutti i flag di qualità dei dati. I flag non cancellano righe; flag_importo_anomalo esclude il lotto dalle somme."
    config:
      meta:
        chiave: cig
    columns:
      - name: cig
        description: "Codice Identificativo Gara."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cig__corrente')
                field: cig
      - name: flag_duplicato_esatto
        description: "Il CIG ha righe identiche ripetute in almeno un file."
      - name: flag_duplicato_conflittuale
        description: "Il CIG ha righe prevalenti diverse nello stesso file."
      - name: flag_data_impossibile
        description: "Scadenza o aggiudicazione prima della pubblicazione, o una data prima del 2007 o oltre due anni dalla data di riferimento."
      - name: flag_importo_non_positivo
        description: "importo_lotto minore o uguale a zero."
      - name: flag_importo_oltre_gara
        description: "importo_lotto maggiore dell'importo complessivo della gara."
      - name: flag_importo_implausibile
        description: "importo_lotto oltre importo_max_plausibile (5 miliardi)."
      - name: flag_importo_non_leggibile
        description: "importo_lotto o importo_complessivo_gara non vuoto nel file ma non leggibile (formato sconosciuto, oltre decimal(18,2)): il testo originale è in importo_lotto_raw e importo_complessivo_gara_raw."
      - name: flag_importo_mad
        description: "|log10(importo) − mediana| oltre mad_fattore × 1,4826 × MAD nel gruppo divisione CPV × oggetto principale (gruppi di almeno 30 lotti)."
      - name: flag_importo_anomalo
        description: "Uno qualsiasi dei cinque flag di importo (non positivo, oltre gara, implausibile, non leggibile, MAD): il lotto è contato ma escluso dalle somme."
      - name: flag_senza_aggiudicatario
        description: "Lotto aggiudicato (esito o aggiudicazione presente) senza alcun aggiudicatario."
      - name: flag_stazione_orfana
        description: "codice_ausa assente dall'anagrafe delle stazioni appaltanti."
      - name: flag_ribasso_fuori_range
        description: "Ribasso fuori dall'intervallo 0–100 %."
      - name: flag_aggiudicazione_non_leggibile
        description: "Importo o ribasso di un'aggiudicazione non vuoto nel file ma non leggibile; il testo originale è in importo_aggiudicazione_raw e ribasso_aggiudicazione_raw."

  - name: int_riconciliazione
    description: "File atterrati validi con righe atterrate, righe dichiarate da ANAC e stato della riconciliazione."
    config:
      meta:
        chiave: sha256
    columns:
      - name: sha256
        description: "SHA-256 dello zip."
        data_tests:
          - unique
          - not_null
      - name: riconciliazione
        description: "ok, differenza o non_disponibile."
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "differenza", "non_disponibile"]

  - name: int_perdite_parsing
    description: "Perdite di tipizzazione per colonna: righe atterrate con un testo non vuoto che staging trasforma in NULL, per le date e i conteggi usati dai mart (data_pubblicazione, data_scadenza_offerta, data_aggiudicazione_definitiva, numero_offerte_ammesse, num_imprese_offerenti, date di varianti e subappalti). Conta tutte le righe atterrate, anche le versioni superate. Alimenta il report della qualità dei dati."
    config:
      meta:
        chiave: [tabella, colonna]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tabella, colonna]
    columns:
      - name: tabella
        description: "Tabella ANAC di origine."
        data_tests:
          - not_null
      - name: colonna
        description: "Colonna controllata."
        data_tests:
          - not_null
      - name: n_valorizzate
        description: "Righe con un testo non vuoto."
      - name: n_perdite
        description: "Di queste, righe in cui la tipizzazione dà NULL."

unit_tests:
  - name: test_perdite_parsing
    description: "Testo non vuoto con valore tipizzato NULL è una perdita; vuoti e formati letti (ISO, gg/mm/aaaa, '27.0') no; '27.5' come conteggio è una perdita."
    model: int_perdite_parsing
    given:
      - input: source('anac', 'cig')
        format: sql
        rows: |
          select * from (values
          ('2025-03-01', '2025-04-01'),
          ('03/12/2025', 'boh'),
          ('31/02/2025', ''),
          ('', '12-03-2025')
          ) as v(data_pubblicazione, data_scadenza_offerta)
      - input: source('anac', 'aggiudicazioni')
        format: sql
        rows: |
          select * from (values
          ('2025-03-01', '3', '3.0'),
          ('x', '27.5', ''),
          ('', '', 'n.d.')
          ) as v(data_aggiudicazione_definitiva, numero_offerte_ammesse, num_imprese_offerenti)
      - input: source('anac', 'varianti')
        format: sql
        rows: |
          select * from (values ('2025-03-01')) as v(data_approvazione_variante)
      - input: source('anac', 'subappalti')
        format: sql
        rows: |
          select * from (values ('2025-13-45')) as v(data_autorizzazione)
    expect:
      rows:
        - {tabella: cig, colonna: data_pubblicazione, n_valorizzate: 3, n_perdite: 1}
        - {tabella: cig, colonna: data_scadenza_offerta, n_valorizzate: 3, n_perdite: 2}
        - {tabella: aggiudicazioni, colonna: data_aggiudicazione_definitiva, n_valorizzate: 2, n_perdite: 1}
        - {tabella: aggiudicazioni, colonna: numero_offerte_ammesse, n_valorizzate: 2, n_perdite: 1}
        - {tabella: aggiudicazioni, colonna: num_imprese_offerenti, n_valorizzate: 2, n_perdite: 1}
        - {tabella: varianti, colonna: data_approvazione_variante, n_valorizzate: 1, n_perdite: 0}
        - {tabella: subappalti, colonna: data_autorizzazione, n_valorizzate: 1, n_perdite: 1}

  - name: test_versione_corrente_e_duplicati
    description: "La versione corrente è la più recente per _data_snapshot; duplicati esatti contati; due righe prevalenti diverse nello stesso file segnalano un conflitto."
    model: int_cig__versioni
    given:
      - input: ref('stg_anac__cig')
        rows:
          - {cig: AAA0000001, flag_prevalente: true, importo_lotto: 100, _risorsa: cig_csv_2025_01, _data_snapshot: "2026-01-16", _hash_riga: h1}
          - {cig: AAA0000001, flag_prevalente: true, importo_lotto: 100, _risorsa: cig_csv_2025_01, _data_snapshot: "2026-01-16", _hash_riga: h1}
          - {cig: AAA0000001, flag_prevalente: false, importo_lotto: 100, _risorsa: cig_csv_2025_01, _data_snapshot: "2026-01-16", _hash_riga: h2}
          - {cig: AAA0000001, flag_prevalente: true, importo_lotto: 110, _risorsa: 20260401-cig_csv, _data_snapshot: "2026-04-01", _hash_riga: h3}
          - {cig: BBB0000002, flag_prevalente: true, importo_lotto: 200, _risorsa: cig_csv_2025_01, _data_snapshot: "2026-01-16", _hash_riga: h4}
          - {cig: BBB0000002, flag_prevalente: true, importo_lotto: 300, _risorsa: cig_csv_2025_01, _data_snapshot: "2026-01-16", _hash_riga: h5}
    expect:
      rows:
        - {cig: AAA0000001, _risorsa: 20260401-cig_csv, importo_lotto: 110, n_versioni: 2, ordine_versione: 1, n_duplicati_esatti: 0, flag_duplicato_conflittuale: false}
        - {cig: AAA0000001, _risorsa: cig_csv_2025_01, importo_lotto: 100, n_versioni: 2, ordine_versione: 2, n_duplicati_esatti: 1, flag_duplicato_conflittuale: false}
        - {cig: BBB0000002, _risorsa: cig_csv_2025_01, importo_lotto: 200, n_versioni: 1, ordine_versione: 1, n_duplicati_esatti: 0, flag_duplicato_conflittuale: true}
